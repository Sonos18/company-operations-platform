name: Pre-PR verify

on:
  push:
    branches:
      - feat/instacloud-agent-sandbox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install --global pnpm@10.29.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sandbox target guard
        env:
          NUXT_PUBLIC_SUPABASE_URL: https://gtgljlnhwvhqdnwrfdfj.supabase.co
          NUXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci-placeholder
          NUXT_SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci-placeholder
        run: pnpm instacloud:sandbox:guard

      - name: Verify application
        run: pnpm verify:app

      - name: Build sandbox container
        run: docker build --tag taskovia-instacloud-sandbox:ci .
