<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bạn được mời vào Taskovia</title>
  </head>
  <body style="margin:0;background:#f5f7f6;color:#17342a;font-family:Arial,sans-serif;line-height:1.5;">
    <main style="max-width:600px;margin:32px auto;padding:32px;background:#ffffff;border-radius:12px;">
      <p style="margin:0 0 24px;font-weight:700;letter-spacing:0.08em;">TASKOVIA</p>
      <h1 style="margin:0 0 16px;font-size:28px;">Chào mừng bạn đến với Taskovia</h1>
      <p>Bạn đã được mời tham gia không gian làm việc Taskovia. Hãy đặt mật khẩu để bắt đầu.</p>
      <p style="margin:28px 0;">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=invite" style="display:inline-block;padding:12px 20px;background:#1a3c2b;color:#ffffff;border-radius:8px;font-weight:700;text-decoration:none;">Đặt mật khẩu và tham gia</a>
      </p>
      <p style="margin:0;color:#52665e;font-size:14px;">Nếu bạn không chờ lời mời này, bạn có thể bỏ qua email.</p>
    </main>
  </body>
</html>
