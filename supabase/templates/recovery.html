<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu Taskovia</title>
  </head>
  <body style="margin:0;background:#f5f7f6;color:#17342a;font-family:Arial,sans-serif;line-height:1.5;">
    <main style="max-width:600px;margin:32px auto;padding:32px;background:#ffffff;border-radius:12px;">
      <p style="margin:0 0 24px;font-weight:700;letter-spacing:0.08em;">TASKOVIA</p>
      <h1 style="margin:0 0 16px;font-size:28px;">Đặt lại mật khẩu của bạn</h1>
      <p>Chúng tôi đã nhận được yêu cầu đặt lại mật khẩu cho tài khoản Taskovia của bạn.</p>
      <p style="margin:28px 0;">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:12px 20px;background:#1a3c2b;color:#ffffff;border-radius:8px;font-weight:700;text-decoration:none;">Đặt lại mật khẩu</a>
      </p>
      <p style="margin:0;color:#52665e;font-size:14px;">Nếu bạn không yêu cầu đặt lại mật khẩu, bạn có thể bỏ qua email này.</p>
    </main>
  </body>
</html>
